<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lover's Memoir | Heavenly Host Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020204;
            --ghost-blue: #d1e5ff;
            --psp-blue: linear-gradient(180deg, #000080 0%, #000033 100%);
            --selection-red: rgba(255, 0, 0, 0.85);
            --paper-text: #2a1e1b;
            --blood: #7a0f14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Special Elite', serif;
        }

        /* --- OVERLAYS --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        #ghost-text {
            font-size: 3rem;
            color: #90cdff;
            letter-spacing: 10px;
            text-shadow: 0 0 40px rgba(168, 216, 255, 1), 0 0 80px rgba(209, 229, 255, 0.9), 0 0 150px rgba(168, 216, 255, 0.6), 0 0 200px rgba(168, 216, 255, 0.4);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        #ghost-voice-screen {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .intro-text {
            font-size: 3rem;
            color: #a8d8ff;
            letter-spacing: 15px;
            animation: none;
            text-shadow: 0 0 20px rgba(168, 216, 255, 0.6), 0 0 40px rgba(209, 229, 255, 0.3);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        @keyframes introPulse { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.95) 100%);
            z-index: 10;
            pointer-events: none;
        }

        #red-flash {
            position: fixed;
            inset: 0;
            background: #ff0612;
            z-index: 8000;
            display: none;
            pointer-events: none;
        }

        #red-flash.active { display: block; animation: redFlicker 0.25s steps(2) infinite; }
        @keyframes redFlicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* CRT Scanlines */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10000;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- SCENE SETUP --- */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            background: black;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .scene-container.visible {
            opacity: 1;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.5) contrast(1.2);
        }

        /* --- INTERACTIVE ZONES --- */
        .paper-zone {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 50%;
        }

        .paper-zone img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.3s ease;
        }

        .paper-zone:hover img {
            transform: scale(1.12);
            filter: brightness(1.2);
        }

        .hover-title {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%) translateY(15px);
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 0 20px var(--ghost-blue), 0 0 30px rgba(209, 229, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: all 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 2px solid var(--ghost-blue);
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(209, 229, 255, 0.4);
        }

        .paper-zone:hover .hover-title {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Disabled paper state */
        .paper-zone.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .paper-zone.locked:hover img {
            transform: scale(1);
            filter: brightness(0.8);
        }
        .zone-1 { top: 20%; left: 20%; width: 18%; height: 30%; } /* Top Left */
        .zone-2 { top: 14%; left: 48%; width: 18%; height: 31%; } /* Top Right */
        .zone-3 { top: 42%; left: 38%; width: 19%; height: 29%; } /* Center */
        .zone-4 { top: 56%; left: 18%; width: 19%; height: 32%; } /* Bottom Left */
        .zone-5 { top: 46%; left: 60%; width: 18%; height: 31%; } /* Bottom Right */

        /* --- PSP MENU --- */
        .overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay.active { opacity: 1; visibility: visible; }

        .psp-box {
            background: var(--psp-blue);
            border: 5px solid #fff;
            padding: 50px;
            width: 700px;
            text-align: center;
            box-shadow: 0 0 100px #000;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .overlay.active .psp-box { transform: translateX(0); }

        .psp-box p { 
            font-size: 2.4rem; 
            margin-bottom: 60px;
            color: #fff; 
            text-shadow: 2px 2px #000;
            word-spacing: 0.5em;
            white-space: pre-line;
        }

        #choiceOverlay .psp-box p {
            font-size: 1.8rem;
            margin-bottom: 40px;
        }

        .choice-btn {
            background: none;
            border: none;
            color: #aaa;
            font-family: 'Special Elite', serif;
            font-size: 1.8rem;
            padding: 10px 50px;
            margin: 0 20px;
            position: relative;
            z-index: 1;
            cursor: pointer;
            transition: 0.2s;
        }

        .choice-btn:hover { color: white; }
        .choice-btn:hover::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140%; height: 80%; background: linear-gradient(90deg, transparent, var(--selection-red), transparent);
            filter: blur(10px); z-index: -1;
        }

        /* --- THE LETTER --- */
        .letter-content {
            display: flex;
            flex-direction: column;
            background: #d9cbb3;
            background-image: 
                url('blood1.png'),
                url('blood2.png'),
                url('https://www.transparenttextures.com/patterns/parchment.png');
            background-position: top left, bottom right, center;
            background-repeat: no-repeat, no-repeat, repeat;
            background-size: 300px 300px, 280px 280px, cover;
            filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0));
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0.3));
            color: var(--paper-text);
            padding: 50px;
            width: 85vw;
            max-width: 900px;
            height: 80vh;
            max-height: 80vh;
            border: 2px solid #998c76;
            font-family: 'Crimson Text', serif;
            opacity: 0;
            transform: scale(0.8) rotate(-5deg);
            transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            overflow: hidden;
            position: relative;
        }

        .letter-content::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: none;
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        #letterBody {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 10px;
            margin-right: -10px;
        }

        #letterBody::-webkit-scrollbar {
            width: 8px;
        }

        #letterBody::-webkit-scrollbar-track {
            background: rgba(153, 140, 118, 0.2);
        }

        #letterBody::-webkit-scrollbar-thumb {
            background: #998c76;
            border-radius: 4px;
        }

        #letterBody::-webkit-scrollbar-thumb:hover {
            background: #8b7355;
        }

        .letter-content.open { opacity: 1; transform: scale(1) rotate(-1deg); pointer-events: auto; }
        .letter-text { font-size: 1.8rem; line-height: 1.6; font-style: italic; white-space: pre-wrap; }

        .memoir-with-photo {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            align-items: center;
        }

        .memoir-text {
            font-size: 2.4rem;
            line-height: 1.6;
            font-style: italic;
            white-space: pre-wrap;
            width: 100%;
            text-align: justified;
        }

        .memoir-text.centered {
            text-align: center;
            font-style: normal;
        }

        .photo-frame {
            position: relative;
            width: 280px;
            height: 380px;
            background: #f5f5f0;
            border: 12px solid #f5f5f0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4),
                        inset 0 0 0 1px #e8e8e0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transform: rotate(-2deg);
        }

        .polaroid-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            font-family: 'Special Elite', serif;
            font-size: 1.2rem;
            color: #8b7355;
            text-align: center;
            font-style: italic;
        }
        

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-frame-empty {
            color: #8b7355;
            font-size: 1.2rem;
            text-align: center;
            opacity: 0.6;
            font-style: italic;
        }

        .transparent-frame {
            position: relative;
            width: 300px;
            height: 300px;
            background: transparent;
            border: 2px dashed #998c76;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 30px;
        }

        .transparent-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .transparent-frame-empty {
            color: #998c76;
            font-size: 1.1rem;
            text-align: center;
            opacity: 0.5;
            font-style: italic;
        }

        /* --- GHOSTS --- */
        .whisper {
            position: fixed; 
            color: #a8d8ff; 
            font-size: 1.8rem;
            font-weight: bold;
            pointer-events: none; 
            z-index: 95; 
            animation: ghostFade 8s forwards ease-in-out;
            text-shadow: 
                0 0 8px #a8d8ff,
                0 0 15px rgba(168, 216, 255, 0.6),
                2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }
        @keyframes ghostFade { 
            0% { opacity: 0; } 
            10% { opacity: 1; } 
            90% { opacity: 1; } 
            100% { opacity: 0; } 
        }

        .glitch { animation: glitchPulse 0.15s steps(1) infinite; }
        @keyframes glitchPulse { 0% { filter: contrast(3) invert(1); } 100% { filter: none; } }

        /* Close button styling */
        .close-letter {
            display: block;
            margin-top: 30px;
            color: var(--blood);
            cursor: pointer;
            text-align: right;
            font-size: 1.4rem;
            transition: 0.2s;
            flex-shrink: 0;
            padding-top: 15px;
            border-top: 1px solid rgba(153, 140, 118, 0.3);
        }

        .close-letter:hover {
            color: #a01119;
            text-shadow: 0 0 10px var(--blood);
        }
    </style>
</head>
<body class="crt">

    <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
    <audio id="tick"><source src="hover.mp3" type="audio/mpeg"></audio>
    <audio id="click"><source src="click.mp3" type="audio/mpeg"></audio>
    <audio id="paper"><source src="paper.mp3" type="audio/mpeg"></audio>
    <audio id="static"><source src="static.mp3" type="audio/mpeg"></audio>
    <audio id="ghost" preload="auto"><source src="ghost.mp3" type="audio/mpeg"></audio>

    <div id="ghost-voice-screen" style="display: none;"><div class="ghost-text" id="ghost-text"></div></div>
    <div id="narrative-screen" class="overlay" style="cursor: pointer;">
        <div class="psp-box" style="width: 80%; max-height: 60vh; padding: 40px;">
            <p id="narrative-text" style="font-size: 1.8rem; line-height: 1.8;"></p>
            <div style="margin-top: 40px; color: #888; text-align: center; font-size: 1.2rem;">[Click to continue]</div>
        </div>
    </div>
    <div id="red-flash"></div>
    <div class="vignette"></div>
    <div id="whisper-container"></div>

    <div class="scene-container">
        <!-- Main Image -->
        <img src="background.png" class="background-image" alt="Heavenly Host Floor">

        <!-- Clickable Paper Zones with Images -->
        <div class="paper-zone zone-1" onclick="askRead(0)" onmouseenter="playTick()">
            <img src="paper1.png" alt="Lover's Memoir 1/5">
            <div class="hover-title">Lovers Memoir 1/5</div>
        </div>
        <div class="paper-zone zone-2" onclick="askRead(1)" onmouseenter="playTick()">
            <img src="paper2.png" alt="Lover's Memoir 2/5">
            <div class="hover-title">Lovers Memoir 2/5</div>
        </div>
        <div class="paper-zone zone-3" onclick="askRead(2)" onmouseenter="playTick()">
            <img src="paper3.png" alt="Lover's Memoir 3/5">
            <div class="hover-title">Lovers Memoir 3/5</div>
        </div>
        <div class="paper-zone zone-4" onclick="askRead(3)" onmouseenter="playTick()">
            <img src="paper4.png" alt="Lover's Memoir 4/5">
            <div class="hover-title">Lovers Memoir 4/5</div>
        </div>
        <div class="paper-zone zone-5" onclick="askRead(4)" onmouseenter="playTick()">
            <img src="paper5.png" alt="Lover's Memoir 5/5">
            <div class="hover-title">Lovers Memoir 5/5</div>
        </div>
    </div>

    <!-- UI -->
    <div class="overlay" id="choiceOverlay">
        <div class="psp-box">
            <p id="choicePrompt">Uncover this memoir?</p>
            <div style="display: flex; justify-content: center;">
                <button class="choice-btn" onclick="revealMemoir()">Yes</button>
                <button class="choice-btn" onclick="closeAll()">No</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="narrativeOverlay">
        <div class="psp-box">
            <p>After going around the school you seem to have found notes scattered around</p>
        </div>
    </div>

    <div class="overlay" id="letterOverlay">
        <div class="letter-content" id="letterContainer">
            <div class="letter-text" id="letterBody"></div>
            <span class="close-letter" onclick="closeAll()">[ Leave it behind ]</span>
        </div>
    </div>

    <script>
        const memoirs = [
            "Lovers Memoir 1/5\n\nThe halls are quiet again today.\n\nI thought I heard your footsteps earlier.\nI stood there for a while waiting for your voice to call out to me, but it never came.\n\nMaybe it was just my imagination again.\n\nI've started forgetting how long it's been since I last saw your smile. Time feels strange here. Days pass without meaning. Sometimes I sit alone and scroll through our old messages over and over just to remember what it felt like to be close to you.\n\nI read every word like it's the only thing keeping me here.\n\nYou still sound alive in those messages. Warm. Gentle. Real.\n\nSometimes I laugh quietly at the pictures we took together. Sometimes I can't bear to look at them for too long.\n\nBut I always come back to them.\n\nI still keep that picture of us in my wallet.\n\nThe corners are worn now from how often I take it out.\nI think if I stare at it long enough, maybe I'll remember the warmth of your hand again. Maybe I'll hear your laugh clearly instead of trying to piece it together from memory.\n\nIt gets lonely here.\n\nNot the kind of lonely that scares you immediately.\nThe slow kind.\nThe kind that settles into your chest quietly when there's nobody beside you anymore.\n\nBut even then… I keep waiting.\n\nEvery day, I wait for another message.\nAnother call.\nAnother moment where I can hear your voice again and feel like the world isn't so empty.\n\nAnd if you ever come looking for me—\n\nPlease know I never left willingly.\n\nI was always here.\n\nWaiting for you.",
            
            "Lovers Memoir 2/5\n\nBefore all of this happened, life already felt cruel enough.\n\nI remember the sleepless nights most clearly.\n\nThe glow of our screens at impossible hours.\nStacks of unfinished requirements.\nThe constant weight in our chests every time another deadline appeared.\nIt felt like we were drowning quietly while pretending we were still functioning.\n\nThird year was brutal.\n\nMore brutal than I can put into words.\n\nThere were days I genuinely thought we'd break from the pressure of trying to stay sane while everything around us demanded more and more. We kept running on exhaustion like it was normal. We laughed through stress because if we stopped moving for even a second, we'd probably fall apart.\n\nBut somehow…\n\nWe survived it.\n\nAnd honestly, I don't think I would've made it through those months without you.\n\nYour words always reached me at the right moments.\n\nEven small things you said stayed with me longer than you probably realized. In the middle of panic, exhaustion, and overthinking, your voice always felt softer than the rest of the world.\n\nYou made difficult days feel survivable.\n\nSo if the day ever comes where you feel tired instead…\n\nI hope you remember that you never have to carry everything alone.\n\nIf life becomes too heavy, let me hold part of it with you.\n\nIf your thoughts get too loud, I'll listen to every rant until the sun rises again.\n\nAnd when you feel insecure… when you feel like you're falling behind… when you think you're not enough because things didn't go perfectly—\n\nPlease don't punish yourself for being human.\n\nA title never changed who you are to me.\n\nNot once.\n\nWhether it was President's List or Dean's List, your effort, your heart, and your worth remained exactly the same in my eyes.\n\nI wish you could see yourself the way I do.\n\nNot as someone failing to reach perfection…\nbut as someone who kept going despite how exhausted she was.\n\nAnd I'll keep reminding you of that for as long as you need me to.\n\nBecause even after everything\n\nI'm still here beside you.",
            
            "I always place us together.\n\nEven in worlds that do not belong to us.\n\nInside Tomodachi Life,\nI quietly arrange our rooms side by side,\nthen wait patiently for fate to do the rest.\n\nSometimes the randomizer chooses us immediately.\nSometimes it takes time.\n\nBut I still watch anyway.\n\nJust hoping.\n\nAnd every single time our characters smile at each other,\nsome embarrassingly soft part of me feels warm all over again.\n\nIt's silly, isn't it?\n\nBut it never stops with only us.\n\nEven your other characters somehow end up tangled with mine in my thoughts.\nAcross dungeon halls, ruined kingdoms, late-night campaigns, and unfinished stories,\nI keep imagining them finding each other too.\n\nI know they already have their own canon loves.\nTheir own destined people.\nTheir own stories written carefully by your hands.\n\nAnd honestly—\n\nI adore those stories because they came from you.\n\nBut still…\n\nSomething inside me becomes strangely happy whenever chance itself chooses otherwise.\nWhen fate accidentally pairs your creations with mine instead.\n\nNot because I want to take their stories away.\n\nBut because loving you has made me selfish in soft, harmless ways.\n\nThe kind that makes me want every universe, fictional or not,\nto let me stay beside you somehow.\n\nMaybe that's why I keep doing this.\n\nBecause in every world I touch,\nI look for you first.\n\nAnd when randomness finally decides to place us together\n\nIt feels less like coincidence\nand more like something inevitable.\n\nAs if even imaginary worlds know\nI was always going to find you.",
            
            "Lovers Memoir 4/5\n\nI remember asking you what we would do if we ended up in a place like this together.\n\nBack then it was easy to laugh about it while the screen flickered in front of us. We spoke about it like it was some distant nightmare that could never reach us. You asked me if I thought I would survive.\n\nI told you no.\n\nI said I would probably kill myself before anything here could get me first. Before the fear, before the pain, before I became one more broken thing wandering these halls. It sounded the most reasonable, why would I endure the pain and fear, when I can just take the easy way out?\n\nI meant it.\n\nEven now, I know how weak I can be when I'm alone. Fear settles into my bones too easily. The dark gets louder when there's nobody beside me to remind me I'm still human. I think part of me has always wanted to run from difficult things before they could swallow me whole.\n\nThat's why I keep thinking about what I said back then.\n\nBecause if you were here with me now… I don't think I could do it.\n\nYou once joked that if things became hopeless, we'd share some kind of poison together. Die before this place could separate us. At the time it sounded romantic in the sad sort of way only we could understand.\n\nBut the more I think about it, the more I realize I would fight against death itself if it meant keeping you safe a little longer.\n\nI would force my shaking hands to hold the door shut.\n\nI would walk first through every dark hallway.\n\nI would lie and say I'm not scared just so you could rest for a moment.\n\nBecause somehow, when I'm with you, being brave feels possible.\n\nNot because the fear disappears. Not because the world becomes kinder. But because you make me want to survive it.\n\nMost people only know one side of me.\n\nMy family sees me as unreliable. Like I'll hesitate when things become difficult. Like I'll fall apart when pressure finally crushes me.\n\nMy college friends see the opposite. Someone dependable. Someone calm enough to carry things when everyone else is overwhelmed. But they never really see the parts of me that are terrified underneath all of it.\n\nYou see both.\n\nYou see the coward and the person trying desperately not to be one.\n\nAnd somehow… instead of making me feel weaker for it, you make me stronger than anyone else ever has.\n\nYou bring out the version of me that wants to fight instead of run. The version that wants to keep moving no matter how frightened I am. The version of me that believes difficult things become easier if I just take the leap and trust you'll still be there when I land.\n\nIf this place ever tried to take you from me, I think I would finally understand how far a coward can go for someone they love.",
            
            "Lovers Memoir 5/5\n\nDo you understand what you've done to me?\n\nBecause I don't think you do.\n\nI don't think you realize how deeply you've buried yourself into every part of my life. How impossible it has become to think about the future without you already there waiting somewhere inside it.\n\nYou are everywhere.\n\nIn every thought I have when I wake up.\n\nIn every quiet moment.\n\nIn every terrible day where I feel like collapsing and somehow still keep going because I know I'll hear your voice later.\n\nAnd it's terrifying sometimes, loving someone this much.\n\nBecause what am I supposed to do with all of it?\n\nWhat am I supposed to do with a heart that only feels calm when it's with you?\n\nI keep imagining you beside me. Talking to me. Looking at me the way you do when I'm overthinking too hard. I swear your presence alone is enough to make me feel sane again.\n\nYou don't even have to do anything.\n\nJust stay.\n\nPlease.\n\nJust stay with me.\n\nI know you don't always understand why I love you this intensely. I know sometimes you laugh it off or call yourself difficult or too emotional or too much, but God, you have no idea how badly I want every version of you anyway.\n\nThe passionate version.\n\nThe tired version.\n\nThe insecure version.\n\nThe version that gets angry at me when you miss me.\n\nI want all of it.\n\nI want every part of you people overlook because to me those parts are precious too.\n\nDo you know how insane it is that fourteen months with you was enough to make you feel inseparable from my own heart?\n\nFourteen months and now everything belongs to you.\n\nMy comfort.\n\nMy softness.\n\nMy need to keep surviving.\n\nEven the parts of me I used to hide from everyone else somehow ended up in your hands.\n\nAnd the worst thing is I trust you with them completely.\n\nSo yes, maybe it's unhealthy how badly I need you sometimes. Maybe it's terrifying that your voice can pull me out of spirals faster than my own thoughts can. Maybe it's pathetic that the idea of losing you feels worse than anything else I can imagine.\n\nBut it's true.\n\nYou are the person my heart chose.\n\nCompletely.\n\nViolently.\n\nIrrevocably.\n\nAnd if this place finally swallows me whole someday, if I end up becoming another forgotten thing trapped in these halls, I think they'll find me still clutching something that belonged to you so tightly my hands had to be pried open.\n\nBecause even at the very end, I don't think my heart would know how to let you go."
        ];

        let narrativeStep = 0;
        let sequenceComplete = false;
        let selectedIndex = 0;
        let audioStarted = false;
        let readCount = 0;
        let unlockedPaper = 0;
        const narrativeTexts = [
            "You have been running around looking for someone.",
            "You come across a room with a faint blue light and enter. Inside you see a familiar body on the floor.",
            "You see notes scattered around it. A ghostly voice beckons you."
        ];
        
        const ghostVoiceTexts = [
            "Star?",
            "Is that you?",
            "You're finally back...."
        ];
        
        // WHISPER MESSAGES - Add or edit ghost quotes here
        const whisperMessages = [
            "Don't leave me, I'm skered...",
            "Welp I fucking died",
            "Baby...",
            "I mean already expected it",
            "Happy 14th love :3",
            "Please don't look at my body, it's embarrassing",
            "You're safe here with me",
            "I wish we could have had more time together",
            "I hope you can forgive me for leaving you alone",
        ];
        
        // Track recently shown whispers to avoid immediate repeats
        let recentlyShownWhispers = [];

        function showGhostVoiceSequence() {
            const ghostScreen = document.getElementById('ghost-voice-screen');
            const ghostText = document.getElementById('ghost-text');
            
            // Play ghost audio right away
            const ghostAudio = document.getElementById('ghost');
            if(ghostAudio) {
                ghostAudio.currentTime = 0;
                ghostAudio.volume = 1.0;
                ghostAudio.play().catch(err => console.error('Ghost audio error:', err.message));
            }
            
            ghostScreen.style.display = 'flex';
            let ghostStep = 0;
            
            function advanceGhost() {
                if(ghostStep < ghostVoiceTexts.length) {
                    ghostText.style.opacity = '0';
                    ghostText.innerText = ghostVoiceTexts[ghostStep];
                    
                    setTimeout(() => {
                        ghostText.style.opacity = '1';
                    }, 100);
                    
                    if(ghostStep < ghostVoiceTexts.length - 1) {
                        ghostStep++;
                        setTimeout(advanceGhost, 2500);
                    } else {
                        // Final line - fade out after delay
                        setTimeout(() => {
                            ghostText.style.opacity = '0';
                            setTimeout(() => {
                                ghostScreen.style.display = 'none';
                                const sceneContainer = document.querySelector('.scene-container');
                                sceneContainer.style.display = 'flex';
                                setTimeout(() => {
                                    sceneContainer.classList.add('visible');
                                }, 50);
                            }, 1500);
                        }, 3000);
                    }
                }
            }
            advanceGhost();
        }

        function advanceNarrative() {
            document.getElementById('tick').play();
            narrativeStep++;
            const screen = document.getElementById('narrative-screen');
            if(narrativeStep < narrativeTexts.length) {
                document.getElementById('narrative-text').innerText = narrativeTexts[narrativeStep];
            } else {
                screen.classList.remove('active');
                setTimeout(() => {
                    screen.style.display = 'none';
                    showGhostVoiceSequence();
                }, 300);
            }
        }

        function startTitleSequence() {
            if(sequenceComplete) return;
            sequenceComplete = true;
        }

        function playTick() {
            if(audioStarted) document.getElementById('tick').play();
        }

        function askRead(index) {
            // Check if this paper is unlocked
            if(index > unlockedPaper) {
                return; // Paper is locked, do nothing
            }
            selectedIndex = index;
            document.getElementById('choicePrompt').innerText = `Read Lover's Memoir ${index + 1}/5?`;
            document.getElementById('click').play();
            document.getElementById('choiceOverlay').classList.add('active');
        }

        function revealMemoir() {
            document.getElementById('click').play();
            document.getElementById('paper').play();
            document.getElementById('choiceOverlay').classList.remove('active');
            
            const flash = document.getElementById('red-flash');
            flash.classList.add('active');
            document.getElementById('bgm').pause();

            setTimeout(() => {
                flash.classList.remove('active');
                document.getElementById('bgm').play();
                document.getElementById('letterOverlay').classList.add('active');
                document.getElementById('letterContainer').classList.add('open');
                
                // Special handling for 5th memoir with photo frame
                if(selectedIndex === 4) {
                    document.getElementById('letterBody').innerHTML = `
                        <div class="memoir-with-photo">
                            <div class="memoir-text">${memoirs[4]}</div>
                            <div class="photo-frame">
                                <img src="" alt="Memory" style="width: 100%; height: 100%; object-fit: cover;">
                                <div class="polaroid-label">us</div>
                            </div>
                        </div>
                    `;
                } else if(selectedIndex === 2) {
                    // Memoir 3 is a poem - center it with transparent image frame
                    document.getElementById('letterBody').innerHTML = `
                        <div class="memoir-with-photo">
                            <div class="memoir-text centered">${memoirs[2]}</div>
                            <div class="transparent-frame">
                                <img src="" alt="Transparent image" style="width: 100%; height: 100%; object-fit: contain;">
                                <div class="transparent-frame-empty" style="display: none;">Add transparent image here</div>
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('letterBody').innerHTML = `<div class="memoir-text">${memoirs[selectedIndex]}</div>`;
                }
                readCount++;
                
                // Reset scroll position to top
                setTimeout(() => {
                    document.getElementById('letterBody').scrollTop = 0;
                }, 50);
                
                // Unlock next paper if available
                if(selectedIndex === unlockedPaper && unlockedPaper < 4) {
                    unlockedPaper++;
                    updatePaperLocks();
                }
                
                // Check if this is the final memoir (5th/last one)
                if(selectedIndex === 4 && readCount === 5) {
                    // Final ending will trigger from closeAll() when "Leave it behind" is clicked
                }
                
                if(readCount >= 2) startCorruption();
            }, 2000);
        }

        function updatePaperLocks() {
            for(let i = 0; i < 5; i++) {
                const zone = document.querySelector(`.zone-${i + 1}`);
                if(i <= unlockedPaper) {
                    zone.classList.remove('locked');
                } else {
                    zone.classList.add('locked');
                }
            }
        }

        function closeAll() {
            document.getElementById('tick').play();
            document.getElementById('bgm').play();
            document.getElementById('letterContainer').classList.remove('open');
            setTimeout(() => {
                document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
                
                // Check if this was the final memoir
                if(selectedIndex === 4 && readCount === 5) {
                    setTimeout(() => showFinalEnding(), 500);
                }
            }, 400);
        }

        function startCorruption() {
            setInterval(() => {
                document.body.classList.add('glitch');
                document.getElementById('static').play();
                setTimeout(() => document.body.classList.remove('glitch'), 150);
            }, 45000);
        }
        
        function showFinalEnding() {
            // Create final ending screen overlay
            const overlay = document.createElement('div');
            overlay.id = 'final-ending';
            overlay.style.position = 'fixed';
            overlay.style.inset = '0';
            overlay.style.background = 'black';
            overlay.style.zIndex = '10000';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.justifyContent = 'center';
            overlay.style.alignItems = 'center';
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 1s ease-in-out';
            
            // Text box - same as intro
            const textBox = document.createElement('div');
            textBox.style.fontFamily = "'Crimson Text', serif";
            textBox.style.fontSize = '2rem';
            textBox.style.color = '#ffffff';
            textBox.style.textAlign = 'center';
            textBox.style.maxWidth = '80%';
            textBox.style.marginBottom = '50px';
            textBox.style.lineHeight = '1.8';
            textBox.style.opacity = '0';
            textBox.style.transition = 'opacity 1s ease-in-out';
            textBox.innerText = "You feel your body being overtaken with overwhelming warmth. It feels safe. You don't want to let go. And neither does the being as it wraps around you.";
            
            // Ghost voice text - blue
            const ghostLine = document.createElement('div');
            ghostLine.style.fontFamily = "'Special Elite', serif";
            ghostLine.style.fontSize = '2.5rem';
            ghostLine.style.color = '#a8d8ff';
            ghostLine.style.textAlign = 'center';
            ghostLine.style.marginTop = '80px';
            ghostLine.style.letterSpacing = '3px';
            ghostLine.style.opacity = '0';
            ghostLine.style.transition = 'opacity 1s ease-in-out';
            ghostLine.style.textShadow = '0 0 30px rgba(168, 216, 255, 0.8), 0 0 60px rgba(209, 229, 255, 0.6)';
            ghostLine.innerText = "You're staying with me.";
            
            // Final word - red, same as blood color
            const finalWord = document.createElement('div');
            finalWord.style.fontFamily = "'Special Elite', serif";
            finalWord.style.fontSize = '3.5rem';
            finalWord.style.color = '#ff0000';
            finalWord.style.textAlign = 'center';
            finalWord.style.marginTop = '120px';
            finalWord.style.letterSpacing = '8px';
            finalWord.style.fontWeight = 'bold';
            finalWord.style.opacity = '0';
            finalWord.style.transition = 'opacity 1s ease-in-out';
            finalWord.style.textShadow = '0 0 40px rgba(122, 15, 20, 0.8), 0 0 80px rgba(122, 15, 20, 0.5)';
            finalWord.innerText = "Forever.";
            
            // Happy message
            const happyMessage = document.createElement('div');
            happyMessage.style.fontFamily = "'Special Elite', serif";
            happyMessage.style.fontSize = '2rem';
            happyMessage.style.color = '#a8d8ff';
            happyMessage.style.textAlign = 'center';
            happyMessage.style.marginTop = '80px';
            happyMessage.style.letterSpacing = '2px';
            happyMessage.style.opacity = '0';
            happyMessage.style.transition = 'opacity 1s ease-in-out';
            happyMessage.style.textShadow = '0 0 30px rgba(168, 216, 255, 0.8), 0 0 60px rgba(209, 229, 255, 0.6)';
            happyMessage.innerText = "Happy 14th my love :3";
            
            overlay.appendChild(textBox);
            overlay.appendChild(ghostLine);
            overlay.appendChild(finalWord);
            overlay.appendChild(happyMessage);
            document.body.appendChild(overlay);
            
            // Fade in overlay
            setTimeout(() => overlay.style.opacity = '1', 50);
            
            // Text box fades in immediately
            setTimeout(() => textBox.style.opacity = '1', 500);
            
            // Ghost voice (blue) fades in after 10 seconds
            setTimeout(() => ghostLine.style.opacity = '1', 10500);
            
            // Forever (red) fades in 3 seconds after ghost voice
            setTimeout(() => finalWord.style.opacity = '1', 13500);
            
            // Happy message fades in 5 seconds after forever
            setTimeout(() => happyMessage.style.opacity = '1', 18500);
            
            // Fade out everything and return to scene after total sequence
            setTimeout(() => {
                textBox.style.opacity = '0';
                ghostLine.style.opacity = '0';
                finalWord.style.opacity = '0';
                happyMessage.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.remove();
                        // Return to the scene
                        const sceneContainer = document.querySelector('.scene-container');
                        if(sceneContainer) {
                            sceneContainer.style.opacity = '1';
                            
                            // Add happy message at bottom of scene
                            const bottomMessage = document.createElement('div');
                            bottomMessage.style.position = 'fixed';
                            bottomMessage.style.bottom = '30px';
                            bottomMessage.style.left = '50%';
                            bottomMessage.style.transform = 'translateX(-50%)';
                            bottomMessage.style.fontFamily = "'Special Elite', serif";
                            bottomMessage.style.fontSize = '2rem';
                            bottomMessage.style.color = '#a8d8ff';
                            bottomMessage.style.textAlign = 'center';
                            bottomMessage.style.letterSpacing = '2px';
                            bottomMessage.style.textShadow = '0 0 30px rgba(168, 216, 255, 0.8), 0 0 60px rgba(209, 229, 255, 0.6)';
                            bottomMessage.style.opacity = '0';
                            bottomMessage.style.transition = 'opacity 1s ease-in-out';
                            bottomMessage.style.zIndex = '100';
                            bottomMessage.style.pointerEvents = 'none';
                            bottomMessage.innerText = 'Happy 14th my love :3';
                            document.body.appendChild(bottomMessage);
                            
                            // Fade in the message
                            setTimeout(() => {
                                bottomMessage.style.opacity = '1';
                            }, 500);
                        }
                    }, 1000);
                }, 1000);
            }, 23500);
        }

        setInterval(() => {
            if(!audioStarted) return;
            
            // Create shuffle order: put recently shown at end, fresh ones at start
            let shuffledMessages = [...whisperMessages];
            
            // Move recently shown to the end
            for(let recent of recentlyShownWhispers) {
                const idx = shuffledMessages.indexOf(recent);
                if(idx !== -1) {
                    shuffledMessages.splice(idx, 1);
                    shuffledMessages.push(recent);
                }
            }
            
            // Pick from fresh ones (first half of array)
            const freshCount = Math.ceil(shuffledMessages.length / 2);
            const freshMessages = shuffledMessages.slice(0, freshCount);
            const chosen = freshMessages[Math.floor(Math.random() * freshMessages.length)];
            
            // Update recently shown
            recentlyShownWhispers.push(chosen);
            if(recentlyShownWhispers.length > 2) {
                recentlyShownWhispers.shift();
            }
            
            const w = document.createElement('div');
            w.className = 'whisper';
            w.innerText = chosen;
            
            // Position whispers only in top-left
            w.style.left = '5%';
            w.style.top = '5%';
            
            document.body.appendChild(w);
            setTimeout(() => w.remove(), 8000);
        }, 15000);

        // Auto-start BGM on page load
        window.addEventListener('load', () => {
            // Pre-load ghost audio
            const ghostAudio = document.getElementById('ghost');
            if(ghostAudio) {
                ghostAudio.load();
                console.log('Ghost audio pre-loaded');
            }
            
            // Auto-play music immediately
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2;
            bgm.play().catch(()=>{});
            audioStarted = true;
            
            updatePaperLocks();
            
            // Start narrative sequence automatically after a brief moment
            setTimeout(() => {
                if(narrativeStep === 0 && !sequenceComplete) {
                    const screen = document.getElementById('narrative-screen');
                    screen.classList.add('active');
                    document.getElementById('narrative-text').innerText = narrativeTexts[0];
                    screen.onclick = advanceNarrative;
                }
            }, 500);
        });
    </script>
</body>
</html>
